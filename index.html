    <!-- JAVASCRIPT FOR INTERACTIVE GALLERY -->
    <script>
        // Function to switch tour content based on clicked thumbnail
        function switchTour(title, price, description, mainImgUrl, clickedThumb) {

            // 1. Get Elements
            const mainImg = document.getElementById('mainTourImg');
            const tourHeader = document.getElementById('tourHeader');
            const tourTitle = document.getElementById('tourTitle');
            const tourPrice = document.getElementById('tourPrice');
            const tourDescription = document.getElementById('tourDescription');

            // 2. Add Animation Class (triggers fade out)
            mainImg.classList.add('changing');
            tourHeader.classList.add('changing');

            // 3. Wait for fade out, then change content
            setTimeout(() => {
                // Update Text Content
                tourTitle.textContent = title;
                tourPrice.textContent = price;
                tourDescription.textContent = description;

                // Update Image Source
                mainImg.src = mainImgUrl;

                // Remove Animation Class (triggers fade in)
                mainImg.classList.remove('changing');
                tourHeader.classList.remove('changing');
            }, 500); // Wait 0.5s matching CSS transition duration

            // 4. Update Active Thumbnail state
            const thumbs = document.querySelectorAll('.gallery-thumb');
            thumbs.forEach(thumb => thumb.classList.remove('active')); // Remove active from all
            clickedThumb.classList.add('active'); // Add active to clicked one
        }
    </script>
